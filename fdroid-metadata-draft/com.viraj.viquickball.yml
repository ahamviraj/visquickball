Summary: Floating touch ball for Android navigation gestures
Description: |-
  Vi's Quick Ball is an assistive Android navigation utility with a floating
  ball. A tap requests Back, a double-tap requests Home, a long press requests
  Recent Apps, and dragging moves the ball to a screen edge.
  .
  The app provides an optional home-screen widget and Android Quick Settings
  tile. The user manually grants display-over-other-apps access and enables the
  Accessibility Service in Android Settings. Recent Apps and background
  behavior can vary by Android version and device manufacturer.
